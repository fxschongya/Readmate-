</style></head><body><header><div><div class="brand">📘 ReadMate</div><div class="small">读懂每一篇，记住每一次进步</div></div><span class="pill" id="countHead"></span></header><main id="app"></main><nav id="nav"><button data-tab="home" class="active">📚 阅读</button><button data-tab="mistakes">🗂️ 记录</button><button data-tab="vocab">🔖 生词</button><button data-tab="manage">⚙️ 管理</button><button data-tab="cloud">☁️ 同步</button></nav><div id="wordBox" class="definition hide" aria-live="polite"></div><script>
'use strict';const STORAGE='readmate_v1';const sample={id:'demo-001',title:'A Small Change in Study Habits',level:'CET-6 入门',passage:`Many students believe that studying longer automatically leads to better results. However, research on learning suggests that how we study often matters more than how many hours we spend at a desk. One useful technique is to review information at increasing intervals rather than repeat it many times in a single evening.\n\nFor example, a student preparing for an English exam might learn ten new words on Monday, review them on Tuesday, and return to them several days later. This approach, commonly called spaced practice, gives the brain repeated opportunities to retrieve information. Although retrieval can feel difficult, that effort may strengthen memory.\n\nAnother helpful habit is to test yourself before checking your notes. Many learners prefer rereading because it feels comfortable. Yet recognizing a sentence on a familiar page is not the same as remembering it without help. Short quizzes can reveal gaps in understanding and make later review more focused.\n\nThese methods do not eliminate the need for hard work. Instead, they suggest that steady, deliberate practice can be more productive than last-minute preparation.`,questions:[{q:'What is the main idea of the passage?',options:['Studying for longer hours is always necessary.','Effective study methods matter as much as study time.','Students should avoid using notes completely.','English examinations require daily quizzes.'],answer:1,explanation:'文章强调学习方式的重要性：间隔复习与主动提取可提升效率。A过于绝对；C、D均不是作者的主张。'},{q:'According to paragraph 2, why can spaced practice help?',options:['It allows students to avoid difficult vocabulary.','It replaces all other kinds of practice.','It provides repeated chances to recall information.','It reduces the total number of words to learn.'],answer:2,explanation:'第二段明确说 gives the brain repeated opportunities to retrieve information。retrieve = recall，故选C。'},{q:'What does the author imply about rereading?',options:['It can create a misleading feeling of familiarity.','It always causes students to forget facts.','It is the most demanding form of study.','It should be used only before examinations.'],answer:0,explanation:'第三段指出“认得熟悉页面上的句子”不等于“不看提示就能记起”，因此重读的熟悉感可能误导学习者。'},{q:'Which practice would best fit the author’s advice?',options:['Reviewing all vocabulary only the night before a test.','Avoiding quizzes until every topic feels easy.','Memorizing notes without checking understanding.','Revisiting words over several days and taking short quizzes.'],answer:3,explanation:'结合第二段 spaced practice 与第三段 short quizzes，只有D同时符合作者建议。'}]};
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}if(!state||!Array.isArray(state.articles)){state={articles:[sample],attempts:[],words:{},drafts:{}}}state.attempts||=[];state.words||={};state.drafts||={};state.articles.forEach((a,i)=>{if(!a.day)a.day=i+1;if(!a.studyDate&&!a.cloudId)a.studyDate='';});let tab='home',articleId=null,answers=[],submitted=false,wordLookups=0,reviewAttempt=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORAGE,JSON.stringify(state));const article=id=>state.articles.find(a=>a.id===id);const choice=i=>Number.isInteger(i)&&i>=0?String.fromCharCode(65+i):'未选择';const dateKey=t=>{let d=new Date(t||Date.now());return Number.isNaN(d.getTime())?'未知日期':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const clock=t=>{let d=new Date(t);return Number.isNaN(d.getTime())?'未知时间':d.toLocaleString('zh-CN')};const dayLabel=a=>a.day?`Day ${Number(a.day)||a.day}`:'未编号';const assignedDate=a=>a.studyDate||a.publishedDate||a.importedDate||(a.createdAt?.toDate?.()?.toISOString?.()||a.createdAt?.seconds&&new Date(a.createdAt.seconds*1000).toISOString())||'';const countAttempt=(at,arr)=>arr.filter(x=>x.articleId===at.articleId&&(new Date(x.time||0)<=new Date(at.time||0))).length;function go(t){tab=t;articleId=null;submitted=false;reviewAttempt=null;render();scrollTo(0,0)}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('countHead').textContent=state.articles.length+' 篇阅读';if(articleId)return renderReader();if(tab==='home')return renderHome();if(tab==='mistakes')return renderMistakes();if(tab==='vocab')return renderVocab();if(tab==='cloud'){if(window.readmateCloud)window.readmateCloud.render();else $('app').innerHTML='<h1>☁️ 同步加载中…</h1>';return}renderManage()}
function renderHome(){let a=state.articles.map(x=>{const hist=state.attempts.filter(y=>y.articleId===x.id),last=hist.at(-1);return `<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="pill">${esc(dayLabel(x))}</span><span class="pill">${esc(x.level||'阅读')}</span></div><div class="muted tiny">${esc(assignedDate(x)?dateKey(assignedDate(x)):'日期待定')} · ${x.questions.length} 道题 · ${last?'已练习 '+hist.length+' 次；最近 '+last.score+'/'+last.total:'尚未练习'}</div><div style="margin-top:10px"><button class="secondary" data-open="${esc(x.id)}">${last?'再做一次':'开始阅读'} →</button></div></div>`}).join('');$('app').innerHTML=`<h1>阅读题库</h1><p class="muted">按 Day 与日期标注每篇阅读；点击文章中的英文单词即可查看中英释义。</p><section class="card">${a||'还没有文章，请到管理页导入。'}</section><div class="notice">📌 每次提交都是独立记录，进入「记录」可按日期查看原文、当时的选项与正确率，重做不会覆盖旧成绩。</div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openArticle(b.dataset.open))}

function tokenize(s){return esc(s).replace(/\b([A-Za-z]+(?:[’'-][A-Za-z]+)*)\b/g,(m,w)=>`<span class="word" data-word="${w}">${w}</span>`)}function openArticle(id){articleId=id;reviewAttempt=null;answers=(state.drafts[id]||[]).slice();submitted=false;render();scrollTo(0,0)}function renderReader(){const a=reviewAttempt?.articleSnapshot||article(articleId);if(!a)return go('home');const isReview=!!reviewAttempt;let qs=a.questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.q)}</strong>${q.options.map((o,j)=>{let cls=(submitted||isReview)?(j===q.answer?'correct':answers[i]===j?'wrong':''):(answers[i]===j?'selected':'');return `<button class="option ${cls}" data-q="${i}" data-o="${j}" ${submitted||isReview?'disabled':''}><span class="key">${choice(j)}.</span><span>${esc(o)}</span></button>`}).join('')}${submitted||isReview?`<div class="notice"><b>${answers[i]===q.answer?'✅ 回答正确':'❌ 回答错误 · 正确答案 '+choice(q.answer)}</b><p>${esc(q.explanation)}</p></div>`:''}</div>`).join('');let score=answers.reduce((n,v,i)=>n+(v===a.questions[i].answer),0);$('app').innerHTML=`<div class="row"><button class="secondary" id="back">← 返回列表</button><span class="spacer"></span><span class="pill">${esc(a.level||'阅读')}</span></div><h1>${esc(a.title)}</h1><p class="muted tiny">${esc(dayLabel(a))} · ${esc(assignedDate(a)?dateKey(assignedDate(a)):'日期待定')}${isReview?' · 历史回看 '+esc(clock(reviewAttempt.time)):''}</p><p class="muted tiny">点按单词查释义 · 浏览器联网查词 · 单词可加入生词本</p><section class="card"><div class="passage" id="passage">${tokenize(a.passage)}</div></section><section class="card"><div class="row"><h2>阅读理解 · ${a.questions.length} 题</h2><span class="spacer"></span><span class="small">已作答 ${answers.filter(v=>v!==null&&v!==undefined).length}/${a.questions.length}</span></div>${qs}${submitted||isReview?`<div class="card" style="background:#eff6ff"><h2>本次得分：${score}/${a.questions.length}（${Math.round(score/a.questions.length*100)}%）</h2><p>${isReview?'这是当时的选择和解析；重做不会覆盖本次记录。':'已保存本次独立答题记录。'}</p><button class="secondary" id="retry">重新做题</button></div>`:`<button class="primary" id="submit" style="width:100%">提交答案并查看解析</button>`}</section>`;$('back').onclick=()=>go(isReview?'mistakes':'home');$('passage').onclick=e=>{const node=e.target.closest('[data-word]');if(node)lookup(node.dataset.word)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{if(isReview)return;answers[+b.dataset.q]=+b.dataset.o;state.drafts[articleId]=answers;save();renderReader()});if(!submitted&&!isReview){$('submit').onclick=()=>{if(answers.filter(v=>v!==null&&v!==undefined).length!==a.questions.length){alert('请先完成全部题目，再提交答案。');return}submitted=true;const attemptNo=state.attempts.filter(x=>x.articleId===a.id).length+1;state.attempts.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),articleId:a.id,articleSnapshot:JSON.parse(JSON.stringify(a)),attemptNo,answers:[...answers],score,total:a.questions.length,time:new Date().toISOString()});delete state.drafts[articleId];save();window.readmateCloud?.submit(a,[...answers],score);renderReader();window.scrollTo({top:document.querySelector('.card:last-child').offsetTop-85,behavior:'smooth'})}}else $('retry').onclick=()=>{reviewAttempt=null;answers=[];submitted=false;delete state.drafts[articleId];save();renderReader()}}
function renderMistakes(){let all=state.attempts.flatMap(at=>{let a=at.articleSnapshot||article(at.articleId);return a?at.answers.map((ans,i)=>({a,at,ans,i,q:a.questions[i]})).filter(x=>x.q&&x.ans!==x.q.answer):[]});let unique=new Set(),items=all.slice().reverse().filter(x=>{let key=x.a.id+':'+x.i;if(unique.has(key))return false;unique.add(key);return true});let attempts=state.attempts.slice().sort((a,b)=>new Date(b.time||0)-new Date(a.time||0));const accuracy=attempts.length?Math.round(100*attempts.reduce((v,a)=>v+a.score,0)/Math.max(1,attempts.reduce((v,a)=>v+a.total,0))):0;const days=[...new Set(attempts.map(a=>dateKey(a.time)))];$('app').innerHTML=`<h1>🗂️ 我的做题记录</h1><div class="row" style="margin-bottom:14px"><div class="stat"><b>${attempts.length}</b><span class="small">累计练习次数</span></div><div class="stat"><b>${accuracy}%</b><span class="small">累计正确率</span></div><div class="stat"><b>${items.length}</b><span class="small">不同错题</span></div></div><section class="card"><h2>按日期查找</h2><label>选择作答日期</label><select id="historyDate" style="width:100%;padding:11px;border:1px solid #d4deec;border-radius:10px"><option value="all">全部日期</option>${days.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select><div id="historyList"></div></section><section class="card"><h2>错题本</h2>${items.length?items.map(x=>`<div class="item"><span class="pill">${esc(dayLabel(x.a))} · ${esc(x.a.title)}</span><p><b>${esc(x.q.q)}</b></p><p class="tiny">你的选项：${choice(x.ans)} · 正确：${choice(x.q.answer)}</p><div class="notice">${esc(x.q.explanation)}</div></div>`).join(''):'暂无错题，继续保持！'}</section>`;function list(d){let chosen=attempts.filter(at=>d==='all'||dateKey(at.time)===d);$('historyList').innerHTML=chosen.length?chosen.map(at=>{let a=at.articleSnapshot||article(at.articleId),n=at.attemptNo||countAttempt(at,state.attempts);return `<div class="item"><div class="row"><b>${esc(a?.title||'历史文章')}</b><span class="pill">${esc(dayLabel(a||{}))}</span></div><div class="tiny muted">${esc(clock(at.time))} · 第 ${n} 次练习 · ${at.score}/${at.total} (${Math.round(at.score/Math.max(1,at.total)*100)}%)</div><div style="margin-top:9px"><button class="secondary" data-review="${esc(at.id)}">回看原文、选项和解析</button> <button class="secondary" data-redo="${esc(at.id)}">重新做题</button></div></div>`}).join(''):'该日期暂无答题记录';document.querySelectorAll('[data-review]').forEach(btn=>btn.onclick=()=>{let at=state.attempts.find(x=>x.id===btn.dataset.review);if(!at)return;let a=at.articleSnapshot||article(at.articleId);if(!a){alert('这条旧记录的原文已删除，无法完整回看');return}reviewAttempt=at;articleId=at.articleId;answers=[...at.answers];submitted=false;render();scrollTo(0,0)});document.querySelectorAll('[data-redo]').forEach(btn=>btn.onclick=()=>{let at=state.attempts.find(x=>x.id===btn.dataset.redo);if(!at)return;if(!article(at.articleId)&&at.articleSnapshot){state.articles.push(at.articleSnapshot);save()}if(!article(at.articleId)){alert('原文章已删除，无法重做');return}articleId=at.articleId;reviewAttempt=null;answers=[];submitted=false;delete state.drafts[articleId];save();render();scrollTo(0,0)})}list('all');$('historyDate').onchange=ev=>list(ev.target.value)}

function renderVocab(){let w=Object.entries(state.words);$('app').innerHTML=`<h1>我的生词本</h1><p class="muted">在阅读文章时点击生词并选择收藏；点击喇叭可朗读。</p><section class="card">${w.length?w.map(([key,obj])=>`<div class="item"><div class="row"><b>${esc(key)}</b><span class="small">${esc(obj.phonetic||'')}</span><span class="spacer"></span><button class="secondary" data-speak="${esc(key)}">🔊</button><button class="danger" data-remove="${esc(key)}">删除</button></div><p>${esc(obj.meaning||'释义待联网获取')}</p>${obj.example?`<p class="muted tiny">${esc(obj.example)}</p>`:''}</div>`).join(''):'暂无收藏的词。'}</section>`;document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.words[b.dataset.remove];save();renderVocab()})}
function renderManage(){$('app').innerHTML=`<h1>文章管理与备份</h1><section class="card"><h2>导入阅读练习</h2><p class="muted">将包含文章、选项、正确答案和解析的 JSON 粘贴进来，一次可导入一篇或多篇。也可以选择 .json 文件。</p><label>粘贴 JSON</label><textarea id="jsonIn" placeholder='{"title":"...","passage":"...","questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}'></textarea><div class="row" style="margin-top:12px"><button class="primary" id="doImport">导入题目</button><button class="secondary" id="template">复制导入模板</button><label style="margin:0" class="secondary">上传 JSON 文件 <input id="upload" type="file" accept=".json,application/json" style="display:none"></label></div><p class="tiny muted" id="importResult"></p></section><section class="card"><h2>资料管理</h2><div class="row"><button class="secondary" id="backup">导出完整备份</button><button class="secondary" id="restore">恢复备份</button><input type="file" accept=".json,application/json" id="restoreFile" class="hide"></div><p class="tiny muted">备份包含题库、作答记录、生词及未提交答案。恢复备份将覆盖当前数据。</p><hr>${state.articles.map(a=>`<div class="item row"><span style="flex:1">${esc(a.title)}<br><span class="tiny muted">${esc(dayLabel(a))} · ${esc(assignedDate(a)?dateKey(assignedDate(a)):'日期未设置')} · ${a.questions.length} 道题</span></span><button class="secondary" data-meta="${esc(a.id)}">日期/Day</button><button class="danger" data-delete="${esc(a.id)}">删除</button></div>`).join('')}</section><div class="notice">🔒 所有数据默认只保存在本机浏览器，不需要注册帐号。在线词典查询需联网；发音使用安卓浏览器的语音功能。启用 Firebase 后，云端发布的阅读和学生的提交成绩支持跨设备同步；个人生词本仍在本机。</div>`;$('doImport').onclick=()=>doImport($('jsonIn').value);$('upload').onchange=async e=>{const f=e.target.files[0];if(f)doImport(await f.text())};$('template').onclick=()=>{const t=JSON.stringify({title:'阅读标题',level:'CET-6',passage:'Your English passage here.\n\nSecond paragraph.',questions:[{q:'What is the main idea?',options:['Option A','Option B','Option C','Option D'],answer:1,explanation:'正确答案为B，因为……'}]},null,2);navigator.clipboard?.writeText(t).then(()=>alert('已复制 JSON 模板')).catch(()=>{$('jsonIn').value=t;alert('模板已填入文本框')})};$('backup').onclick=()=>download(JSON.stringify(state,null,2),'readmate-backup.json');$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.articles)||!Array.isArray(s.attempts)||typeof s.words!=='object')throw Error('备份格式不正确');if(!confirm('确认覆盖本机的所有题库和学习记录？'))return;state=s;save();render();alert('备份恢复成功')}catch(err){alert(err.message)}};document.querySelectorAll('[data-meta]').forEach(b=>b.onclick=()=>{let a=article(b.dataset.meta);if(!a)return;let day=prompt('请输入 Day 编号（例如 1、2、3）',String(a.day||1));if(day===null)return;let num=Number(day);if(!Number.isInteger(num)||num<1){alert('Day 必须是正整数');return}let date=prompt('请输入阅读日期 YYYY-MM-DD',a.studyDate||dateKey(Date.now()));if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date+'T00:00:00'))){alert('日期格式应为 YYYY-MM-DD');return}a.day=num;a.studyDate=date;save();renderManage()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('删除这篇文章？历史答题记录将仍保留，但无法展示已删除文章的题目。'))return;state.articles=state.articles.filter(a=>a.id!==b.dataset.delete);save();render()})}
function validate(a){if(!a||typeof a.title!=='string'||!a.title.trim()||typeof a.passage!=='string'||!a.passage.trim()||!Array.isArray(a.questions)||!a.questions.length)throw Error('缺少 title、passage 或 questions');for(const [i,q] of a.questions.entries())if(typeof q.q!=='string'||!Array.isArray(q.options)||q.options.length<2||q.options.some(s=>typeof s!=='string')||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length||typeof q.explanation!=='string')throw Error(`第 ${i+1} 题格式错误：answer 应为从0开始的正确选项序号，且需填写解析`)}function doImport(raw){try{let data=JSON.parse(raw),list=Array.isArray(data)?data:[data];if(!list.length)throw Error('没有文章');list.forEach(validate);let added=0;list.forEach(a=>{let signature=a.title.trim()+'|'+a.passage.trim();if(state.articles.some(x=>x.title.trim()+'|'+x.passage.trim()===signature))return;state.articles.push({...a,id:'a'+Date.now()+Math.random().toString(36).slice(2,8),day:a.day||state.articles.length+1,studyDate:a.studyDate||dateKey(Date.now()),importedDate:new Date().toISOString()});added++});save();renderManage();$('importResult').textContent=`成功导入 ${added} 篇，跳过重复 ${list.length-added} 篇。`}catch(e){$('importResult').textContent='导入失败：'+e.message}}
function download(content,name){const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function speak(t){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音，请使用最新版 Chrome');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}let currentWord=null;
async function zhTranslate(text){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);
 try{
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,430))+'&langpair=en|zh-CN',{signal:controller.signal});
  if(!r.ok)throw Error('translation HTTP '+r.status);
  const d=await r.json();const translated=(d.responseData?.translatedText||'').trim();
  if(!translated||/^(?:QUERY LENGTH LIMIT|MYMEMORY WARNING|INVALID LANGUAGE PAIR)/i.test(translated))throw Error('translation unavailable');
  return translated;
 }finally{clearTimeout(timeout)}
}
async function lookup(original){
 const w=original.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');if(!w)return;
 currentWord=w;const box=$('wordBox');box.classList.remove('hide');
 const req=++wordLookups;
 const cached=state.words[w]||{};
 box.innerHTML=`<div class="row"><h2>${esc(w)}</h2><span class="spacer"></span><button class="close" id="wordClose">✕</button></div><p class="muted">正在加载中英文释义…</p>`;
 $('wordClose').onclick=()=>box.classList.add('hide');
 const obj={...cached,meaning:cached.meaning||'',phonetic:cached.phonetic||'',example:cached.example||'',zh:cached.zh||''};
 let dictError=false;
 try{
  const res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!res.ok)throw Error('not found');
  const j=(await res.json())[0];obj.phonetic=j.phonetic||j.phonetics?.find(v=>v.text)?.text||obj.phonetic||'';
  const defs=(j.meanings||[]).flatMap(m=>m.definitions.slice(0,2).map(d=>({part:m.partOfSpeech,meaning:d.definition,example:d.example||''}))).slice(0,4);
  obj.meaning=defs.map(d=>d.part+': '+d.meaning).join('\n')||obj.meaning;
  obj.example=defs.find(d=>d.example)?.example||obj.example;obj.defs=defs;
 }catch(e){dictError=true;obj.meaning=obj.meaning||'英文词典暂时无法使用。'}
 if(req!==wordLookups)return;
 // Translate a short dictionary definition when available, not merely the isolated word.
 let cnError=false;
 if(!obj.zh){
  try{obj.zh=await zhTranslate((obj.defs?.[0]?.meaning||w).slice(0,380));}
  catch(e){cnError=true;obj.zh='';}
 }
 if(req!==wordLookups)return;
 const zhText=obj.zh?esc(obj.zh):'中文翻译暂不可用，请点击下方「更多中英释义」查看。';
 box.innerHTML=`<div class="row"><h2>${esc(w)}</h2><span class="small">${esc(obj.phonetic)}</span><span class="spacer"></span><button class="close" id="wordClose">✕</button></div>
 <div class="row"><button class="secondary" id="voice">🔊 发音</button><button class="primary" id="saveWord">${state.words[w]?'✓ 已收藏':'＋ 加入生词本'}</button></div>
 <p style="font-weight:700;margin:12px 0 4px">🇨🇳 中文释义</p><div class="notice" style="line-height:1.65">${zhText}</div>
 <p style="font-weight:700;margin:12px 0 4px">🇬🇧 English definition</p><div style="white-space:pre-line;line-height:1.6">${esc(obj.meaning)}</div>
 ${obj.example?`<p class="small"><b>例句：</b>${esc(obj.example)}</p>`:''}
 <p class="tiny muted">中文释义由自动翻译生成，仅供辅助理解；建议结合原文语境。</p>
 <a href="https://www.youdao.com/result?word=${encodeURIComponent(w)}&lang=en" target="_blank" rel="noopener">更多中英释义 ↗</a>`;
 $('wordClose').onclick=()=>box.classList.add('hide');$('voice').onclick=()=>speak(w);
 $('saveWord').onclick=()=>{state.words[w]={...obj,added:new Date().toISOString()};save();$('saveWord').textContent='✓ 已收藏'};
}
document.addEventListener('click',e=>{if(e.target.closest('#wordBox')||e.target.closest('[data-word]'))return;$('wordBox').classList.add('hide')});window.readmateBridge={escape:esc,currentTab:()=>tab,getArticles:()=>state.articles,formatDate:dateKey,dayLabel,assignedDate,renderHomeIfVisible:()=>{if(tab==='home'&&!articleId)renderHome()},upsertCloudArticle:a=>{let id='cloud-'+a.cloudId;const item={...a,id,day:a.day||state.articles.find(x=>x.id===id)?.day||null,studyDate:a.studyDate||a.publishedDate||''};let index=state.articles.findIndex(x=>x.id===id);if(index<0)state.articles.push(item);else state.articles[index]=item;save()},openArticle};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="firebase-config.js"></script><script type="module" src="cloud.js"></script></body></html>
