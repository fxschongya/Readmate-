<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>ReadMate · 英语阅读练习</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#14213d;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3e9f4;position:sticky;top:0;z-index:5;padding:12px max(16px,calc((100vw - 900px)/2));display:flex;align-items:center;gap:10px;justify-content:space-between}.brand{font-weight:800;font-size:19px;color:#1e40af}.small{font-size:12px;color:#697b96}main{max-width:900px;margin:0 auto;padding:18px 14px 92px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;border-top:1px solid #dfe7f3;padding:10px 3px max(10px,env(safe-area-inset-bottom));z-index:6}nav button{background:transparent;color:#64748b;border:0;font-weight:600;padding:4px 12px;border-radius:9px}nav button.active{color:#1d4ed8;background:#eff6ff}.card{background:#fff;border:1px solid #e0e7f3;border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 4px 20px #1b315009}h1{font-size:24px;margin:3px 0 8px}h2{font-size:18px;margin:0 0 14px}h3{font-size:16px;margin:12px 0 8px}p{line-height:1.7}button{font:inherit;cursor:pointer}button.primary{background:#2563eb;border:0;color:#fff;padding:12px 16px;border-radius:11px;font-weight:700}button.secondary{background:#eff6ff;border:1px solid #c9dcff;color:#1e40af;padding:10px 13px;border-radius:11px;font-weight:650}button.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:10px 13px;border-radius:11px}button:disabled{opacity:.5;cursor:default}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.spacer{flex:1}.muted{color:#64748b}.passage{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:2.05;white-space:pre-wrap;color:#1e293b}.passage .word{cursor:pointer;border-radius:3px}.passage .word:active{background:#bfdbfe}.question{border-top:1px solid #edf1f7;padding:16px 0}.question strong{display:block;line-height:1.6;margin-bottom:10px}.option{width:100%;display:flex;text-align:left;gap:10px;background:#fff;border:1px solid #dbe3ef;border-radius:11px;margin:8px 0;padding:11px;color:#1e293b;line-height:1.55}.option.selected{background:#eff6ff;border:2px solid #3b82f6;padding:10px}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}.option .key{min-width:24px;font-weight:800;color:#475569}.notice{background:#eff6ff;color:#1e40af;padding:12px;border-radius:11px;font-size:13px;line-height:1.6}textarea,input{width:100%;border:1px solid #d4deec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:155px;resize:vertical}label{display:block;font-weight:650;font-size:13px;margin:13px 0 6px}.pill{background:#edf2ff;color:#355ab5;border-radius:999px;padding:4px 9px;font-size:12px}.item{padding:12px 0;border-top:1px solid #edf1f7}.item:first-child{border-top:0}.stat{flex:1;min-width:90px;background:#f5f8fd;padding:13px;border-radius:12px;text-align:center}.stat b{font-size:21px;display:block}.hide{display:none!important}.definition{position:fixed;bottom:75px;left:12px;right:12px;z-index:10;background:white;border:1px solid #c8d5eb;border-radius:18px;box-shadow:0 15px 55px #0f172a35;padding:17px;max-width:650px;margin:auto;max-height:55vh;overflow:auto}.definition h2{font-size:23px;margin-bottom:3px}.definition p{margin:6px 0}.vocab{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tiny{font-size:12px}.close{border:0;background:#f1f5f9;border-radius:8px;padding:7px 11px}hr{border:0;border-top:1px solid #e5ebf3}a{color:#2563eb}@media(min-width:720px){main{padding:24px 20px 100px}.definition{bottom:85px}}
</style></head><body><header><div><div class="brand">📘 ReadMate</div><div class="small">读懂每一篇，记住每一次进步</div></div><span class="pill" id="countHead"></span></header><main id="app"></main><nav id="nav"><button data-tab="home" class="active">📚 阅读</button><button data-tab="mistakes">📝 错题</button><button data-tab="vocab">🔖 生词</button><button data-tab="manage">⚙️ 管理</button><button data-tab="cloud">☁️ 同步</button></nav><div id="wordBox" class="definition hide" aria-live="polite"></div><script>
'use strict';const STORAGE='readmate_v1';const sample={id:'demo-001',title:'A Small Change in Study Habits',level:'CET-6 入门',passage:`Many students believe that studying longer automatically leads to better results. However, research on learning suggests that how we study often matters more than how many hours we spend at a desk. One useful technique is to review information at increasing intervals rather than repeat it many times in a single evening.\n\nFor example, a student preparing for an English exam might learn ten new words on Monday, review them on Tuesday, and return to them several days later. This approach, commonly called spaced practice, gives the brain repeated opportunities to retrieve information. Although retrieval can feel difficult, that effort may strengthen memory.\n\nAnother helpful habit is to test yourself before checking your notes. Many learners prefer rereading because it feels comfortable. Yet recognizing a sentence on a familiar page is not the same as remembering it without help. Short quizzes can reveal gaps in understanding and make later review more focused.\n\nThese methods do not eliminate the need for hard work. Instead, they suggest that steady, deliberate practice can be more productive than last-minute preparation.`,questions:[{q:'What is the main idea of the passage?',options:['Studying for longer hours is always necessary.','Effective study methods matter as much as study time.','Students should avoid using notes completely.','English examinations require daily quizzes.'],answer:1,explanation:'文章强调学习方式的重要性：间隔复习与主动提取可提升效率。A过于绝对；C、D均不是作者的主张。'},{q:'According to paragraph 2, why can spaced practice help?',options:['It allows students to avoid difficult vocabulary.','It replaces all other kinds of practice.','It provides repeated chances to recall information.','It reduces the total number of words to learn.'],answer:2,explanation:'第二段明确说 gives the brain repeated opportunities to retrieve information。retrieve = recall，故选C。'},{q:'What does the author imply about rereading?',options:['It can create a misleading feeling of familiarity.','It always causes students to forget facts.','It is the most demanding form of study.','It should be used only before examinations.'],answer:0,explanation:'第三段指出“认得熟悉页面上的句子”不等于“不看提示就能记起”，因此重读的熟悉感可能误导学习者。'},{q:'Which practice would best fit the author’s advice?',options:['Reviewing all vocabulary only the night before a test.','Avoiding quizzes until every topic feels easy.','Memorizing notes without checking understanding.','Revisiting words over several days and taking short quizzes.'],answer:3,explanation:'结合第二段 spaced practice 与第三段 short quizzes，只有D同时符合作者建议。'}]};
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}if(!state||!Array.isArray(state.articles)){state={articles:[sample],attempts:[],words:{},drafts:{}}}state.attempts||=[];state.words||={};state.drafts||={};let tab='home',articleId=null,answers=[],submitted=false,wordLookups=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORAGE,JSON.stringify(state));const article=id=>state.articles.find(a=>a.id===id);const choice=i=>String.fromCharCode(65+i);function go(t){tab=t;articleId=null;submitted=false;render();scrollTo(0,0)}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('countHead').textContent=state.articles.length+' 篇阅读';if(articleId)return renderReader();if(tab==='home')return renderHome();if(tab==='mistakes')return renderMistakes();if(tab==='vocab')return renderVocab();if(tab==='cloud'){if(window.readmateCloud)window.readmateCloud.render();else $('app').innerHTML='<h1>☁️ 同步加载中…</h1>';return}renderManage()}
function renderHome(){let a=state.articles.map(x=>{const hist=state.attempts.filter(y=>y.articleId===x.id),last=hist.at(-1);return `<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="pill">${esc(x.level||'阅读')}</span></div><div class="muted tiny">${x.questions.length} 道题 · ${last?'最近得分 '+last.score+'/'+last.total:'尚未练习'}</div><div style="margin-top:10px"><button class="secondary" data-open="${esc(x.id)}">${last?'再次练习':'开始阅读'} →</button></div></div>`}).join('');$('app').innerHTML=`<h1>今天读点英语吧 👋</h1><p class="muted">点击文章里的英文单词即可查词、收藏、朗读。做完题一次提交，即可查看解析。</p><section class="card"><h2>阅读题库</h2>${a||'还没有文章，请到管理页导入。'}</section><div class="notice">📌 本机练习记录会自动保存；登录云端的答题方完成教师发布的阅读后，提交成绩也会同步给教师。个人生词本和草稿仍保存在本机，请定期备份。</div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openArticle(b.dataset.open))}
function tokenize(s){return esc(s).replace(/\b([A-Za-z]+(?:[’'-][A-Za-z]+)*)\b/g,(m,w)=>`<span class="word" data-word="${w}">${w}</span>`)}function openArticle(id){articleId=id;answers=(state.drafts[id]||[]).slice();submitted=false;render();scrollTo(0,0)}function renderReader(){const a=article(articleId);if(!a)return go('home');let qs=a.questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.q)}</strong>${q.options.map((o,j)=>{let cls=submitted?(j===q.answer?'correct':answers[i]===j?'wrong':''):(answers[i]===j?'selected':'');return `<button class="option ${cls}" data-q="${i}" data-o="${j}" ${submitted?'disabled':''}><span class="key">${choice(j)}.</span><span>${esc(o)}</span></button>`}).join('')}${submitted?`<div class="notice"><b>${answers[i]===q.answer?'✅ 回答正确':'❌ 回答错误 · 正确答案 '+choice(q.answer)}</b><p>${esc(q.explanation)}</p></div>`:''}</div>`).join('');let score=answers.reduce((n,v,i)=>n+(v===a.questions[i].answer),0);$('app').innerHTML=`<div class="row"><button class="secondary" id="back">← 返回列表</button><span class="spacer"></span><span class="pill">${esc(a.level||'阅读')}</span></div><h1>${esc(a.title)}</h1><p class="muted tiny">点按单词查释义 · 浏览器联网查词 · 单词可加入生词本</p><section class="card"><div class="passage" id="passage">${tokenize(a.passage)}</div></section><section class="card"><div class="row"><h2>阅读理解 · ${a.questions.length} 题</h2><span class="spacer"></span><span class="small">已作答 ${answers.filter(v=>v!==null&&v!==undefined).length}/${a.questions.length}</span></div>${qs}${submitted?`<div class="card" style="background:#eff6ff"><h2>本次得分：${score}/${a.questions.length}（${Math.round(score/a.questions.length*100)}%）</h2><p>已记录答题历史与错题。</p><button class="secondary" id="retry">重新练习</button></div>`:`<button class="primary" id="submit" style="width:100%">提交答案并查看解析</button>`}</section>`;$('back').onclick=()=>go('home');$('passage').onclick=e=>{const node=e.target.closest('[data-word]');if(node)lookup(node.dataset.word)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.o;state.drafts[articleId]=answers;save();renderReader()});if(!submitted){$('submit').onclick=()=>{if(answers.filter(v=>v!==null&&v!==undefined).length!==a.questions.length){alert('请先完成全部题目，再提交答案。');return}submitted=true;state.attempts.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),articleId:a.id,answers:[...answers],score,total:a.questions.length,time:new Date().toISOString()});delete state.drafts[articleId];save();window.readmateCloud?.submit(a,[...answers],score);renderReader();window.scrollTo({top:document.querySelector('.card:last-child').offsetTop-85,behavior:'smooth'})}}else $('retry').onclick=()=>{answers=[];submitted=false;renderReader()}}
function renderMistakes(){let all=state.attempts.flatMap(at=>{let a=article(at.articleId);return a?at.answers.map((ans,i)=>({a,at,ans,i,q:a.questions[i]})).filter(x=>x.ans!==x.q.answer):[]}).reverse();let unique=new Set();let items=all.filter(x=>{let key=x.a.id+':'+x.i;if(unique.has(key))return false;unique.add(key);return true});const attempts=state.attempts;const accuracy=attempts.length?Math.round(100*attempts.reduce((s,a)=>s+a.score,0)/attempts.reduce((s,a)=>s+a.total,0)):0;$('app').innerHTML=`<h1>学习记录与错题</h1><div class="row" style="margin-bottom:14px"><div class="stat"><b>${attempts.length}</b><span class="small">练习次数</span></div><div class="stat"><b>${accuracy}%</b><span class="small">累计正确率</span></div><div class="stat"><b>${items.length}</b><span class="small">不同错题</span></div></div><section class="card"><h2>错题本</h2>${items.length?items.map(x=>`<div class="item"><span class="pill">${esc(x.a.title)}</span><p><b>${esc(x.q.q)}</b></p><p class="tiny">你的选项：${choice(x.ans)} · 正确选项：${choice(x.q.answer)}</p><div class="notice">${esc(x.q.explanation)}</div></div>`).join(''):'暂无错题，继续保持！'}</section><section class="card"><h2>答题历史</h2>${attempts.length?attempts.slice().reverse().map(at=>`<div class="item"><b>${esc(article(at.articleId)?.title||'已删除文章')}</b><div class="tiny muted">${new Date(at.time).toLocaleString()} · ${at.score}/${at.total} · ${Math.round(100*at.score/at.total)}%</div></div>`).join(''):'还没有练习记录。'}</section>`}
function renderVocab(){let w=Object.entries(state.words);$('app').innerHTML=`<h1>我的生词本</h1><p class="muted">在阅读文章时点击生词并选择收藏；点击喇叭可朗读。</p><section class="card">${w.length?w.map(([key,obj])=>`<div class="item"><div class="row"><b>${esc(key)}</b><span class="small">${esc(obj.phonetic||'')}</span><span class="spacer"></span><button class="secondary" data-speak="${esc(key)}">🔊</button><button class="danger" data-remove="${esc(key)}">删除</button></div><p>${esc(obj.meaning||'释义待联网获取')}</p>${obj.example?`<p class="muted tiny">${esc(obj.example)}</p>`:''}</div>`).join(''):'暂无收藏的词。'}</section>`;document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.words[b.dataset.remove];save();renderVocab()})}
function renderManage(){$('app').innerHTML=`<h1>文章管理与备份</h1><section class="card"><h2>导入阅读练习</h2><p class="muted">将包含文章、选项、正确答案和解析的 JSON 粘贴进来，一次可导入一篇或多篇。也可以选择 .json 文件。</p><label>粘贴 JSON</label><textarea id="jsonIn" placeholder='{"title":"...","passage":"...","questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}'></textarea><div class="row" style="margin-top:12px"><button class="primary" id="doImport">导入题目</button><button class="secondary" id="template">复制导入模板</button><label style="margin:0" class="secondary">上传 JSON 文件 <input id="upload" type="file" accept=".json,application/json" style="display:none"></label></div><p class="tiny muted" id="importResult"></p></section><section class="card"><h2>资料管理</h2><div class="row"><button class="secondary" id="backup">导出完整备份</button><button class="secondary" id="restore">恢复备份</button><input type="file" accept=".json,application/json" id="restoreFile" class="hide"></div><p class="tiny muted">备份包含题库、作答记录、生词及未提交答案。恢复备份将覆盖当前数据。</p><hr>${state.articles.map(a=>`<div class="item row"><span style="flex:1">${esc(a.title)}<br><span class="tiny muted">${a.questions.length} 道题</span></span><button class="danger" data-delete="${esc(a.id)}">删除</button></div>`).join('')}</section><div class="notice">🔒 所有数据默认只保存在本机浏览器，不需要注册帐号。在线词典查询需联网；发音使用安卓浏览器的语音功能。启用 Firebase 后，云端发布的阅读和学生的提交成绩支持跨设备同步；个人生词本仍在本机。</div>`;$('doImport').onclick=()=>doImport($('jsonIn').value);$('upload').onchange=async e=>{const f=e.target.files[0];if(f)doImport(await f.text())};$('template').onclick=()=>{const t=JSON.stringify({title:'阅读标题',level:'CET-6',passage:'Your English passage here.\n\nSecond paragraph.',questions:[{q:'What is the main idea?',options:['Option A','Option B','Option C','Option D'],answer:1,explanation:'正确答案为B，因为……'}]},null,2);navigator.clipboard?.writeText(t).then(()=>alert('已复制 JSON 模板')).catch(()=>{$('jsonIn').value=t;alert('模板已填入文本框')})};$('backup').onclick=()=>download(JSON.stringify(state,null,2),'readmate-backup.json');$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.articles)||!Array.isArray(s.attempts)||typeof s.words!=='object')throw Error('备份格式不正确');if(!confirm('确认覆盖本机的所有题库和学习记录？'))return;state=s;save();render();alert('备份恢复成功')}catch(err){alert(err.message)}};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('删除这篇文章？历史答题记录将仍保留，但无法展示已删除文章的题目。'))return;state.articles=state.articles.filter(a=>a.id!==b.dataset.delete);save();render()})}
function validate(a){if(!a||typeof a.title!=='string'||!a.title.trim()||typeof a.passage!=='string'||!a.passage.trim()||!Array.isArray(a.questions)||!a.questions.length)throw Error('缺少 title、passage 或 questions');for(const [i,q] of a.questions.entries())if(typeof q.q!=='string'||!Array.isArray(q.options)||q.options.length<2||q.options.some(s=>typeof s!=='string')||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length||typeof q.explanation!=='string')throw Error(`第 ${i+1} 题格式错误：answer 应为从0开始的正确选项序号，且需填写解析`)}function doImport(raw){try{let data=JSON.parse(raw),list=Array.isArray(data)?data:[data];if(!list.length)throw Error('没有文章');list.forEach(validate);let added=0;list.forEach(a=>{let signature=a.title.trim()+'|'+a.passage.trim();if(state.articles.some(x=>x.title.trim()+'|'+x.passage.trim()===signature))return;state.articles.push({...a,id:'a'+Date.now()+Math.random().toString(36).slice(2,8)});added++});save();renderManage();$('importResult').textContent=`成功导入 ${added} 篇，跳过重复 ${list.length-added} 篇。`}catch(e){$('importResult').textContent='导入失败：'+e.message}}
function download(content,name){const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function speak(t){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音，请使用最新版 Chrome');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}let currentWord=null;async function lookup(original){const w=original.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');if(!w)return;currentWord=w;const box=$('wordBox');box.classList.remove('hide');box.innerHTML=`<div class="row"><h2>${esc(w)}</h2><span class="spacer"></span><button class="close" id="wordClose">✕</button></div><p class="muted">正在查询词典…</p>`;$('wordClose').onclick=()=>box.classList.add('hide');let obj=state.words[w]||{meaning:'',phonetic:'',example:''};let req=++wordLookups;try{const res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!res.ok)throw Error('词典未找到该词');const j=(await res.json())[0];obj.phonetic=j.phonetic||j.phonetics?.find(v=>v.text)?.text||'';const defs=(j.meanings||[]).flatMap(m=>m.definitions.slice(0,2).map(d=>({part:m.partOfSpeech,meaning:d.definition,example:d.example||''}))).slice(0,4);obj.meaning=defs.map(d=>d.part+': '+d.meaning).join('\n');obj.example=defs.find(d=>d.example)?.example||'';obj.defs=defs}catch(e){if(!obj.meaning)obj.meaning='暂时无法获取词典释义，请联网重试或使用查词链接。';obj.error=e.message}if(req!==wordLookups)return;box.innerHTML=`<div class="row"><h2>${esc(w)}</h2><span class="small">${esc(obj.phonetic)}</span><span class="spacer"></span><button class="close" id="wordClose">✕</button></div><div class="row"><button class="secondary" id="voice">🔊 发音</button><button class="primary" id="saveWord">${state.words[w]?'✓ 已收藏':'＋ 加入生词本'}</button><button class="secondary" id="cnMeaning">中文解释</button><a href="https://www.youdao.com/result?word=${encodeURIComponent(w)}&lang=en" target="_blank" rel="noopener">更多释义 ↗</a></div><div style="white-space:pre-line;margin-top:9px;font-size:14px;line-height:1.6">${esc(obj.meaning)}</div>${obj.example?`<p class="small">例句：${esc(obj.example)}</p>`:''}<p class="tiny muted">词典释义主要为英文；中文释义请点击「中英释义」。</p>`;$('wordClose').onclick=()=>box.classList.add('hide');$('voice').onclick=()=>speak(w);$('cnMeaning').onclick=async()=>{const b=$('cnMeaning');b.disabled=true;b.textContent='翻译中…';try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|zh-CN');const d=await r.json();b.insertAdjacentHTML('afterend','<p class="notice">中文参考：'+esc(d.responseData?.translatedText||'暂无结果')+'</p>')}catch(e){alert('翻译接口暂时不可用，可点击更多释义')}finally{b.textContent='中文解释';b.disabled=false}};$('saveWord').onclick=()=>{state.words[w]={...obj,added:new Date().toISOString()};save();$('saveWord').textContent='✓ 已收藏'}}document.addEventListener('click',e=>{if(e.target.closest('#wordBox')||e.target.closest('[data-word]'))return;$('wordBox').classList.add('hide')});window.readmateBridge={escape:esc,currentTab:()=>tab,getArticles:()=>state.articles,renderHomeIfVisible:()=>{if(tab==='home'&&!articleId)renderHome()},upsertCloudArticle:a=>{let id='cloud-'+a.cloudId;const item={...a,id};let index=state.articles.findIndex(x=>x.id===id);if(index<0)state.articles.push(item);else state.articles[index]=item;save()},openArticle};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="firebase-config.js"></script><script type="module" src="cloud.js"></script></body></html>
