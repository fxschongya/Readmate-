 if(answer===null)return;

  const a=articles[Number(answer)-1];src={articleId:a.id,title:a.title,day:a.day||null,studyDate:a.studyDate||a.publishedDate||'',savedAt:obj.added||new Date().toISOString()};

function validate(a){if(!a||typeof a.title!=='string'||!a.title.trim()||typeof a.passage!=='string'||!a.passage.trim()||!Array.isArray(a.questions)||!a.questions.length)throw Error('缺少 title、passage 或 questions');for(const [i,q] of a.questions.entries()){const type=questionKind(q),size={multiple_choice:4,true_false:2,true_false_not_given:3}[type];if(!size||typeof q.q!=='string'||!q.q.trim()||!Array.isArray(q.options)||q.options.length!==size||q.options.some(s=>typeof s!=='string'||!s.trim())||!Number.isInteger(q.answer)||q.answer<0||q.answer>=size||typeof q.explanation!=='string')throw Error(`第 ${i+1} 题格式错误：type 为 multiple_choice (4选项)、true_false (2选项)、true_false_not_given (3选项)；answer 从0开始，必须有解析`);if(type==='true_false'&&q.options.map(v=>v.trim().toLowerCase()).join('|')!=='true|false')throw Error(`第 ${i+1} 题判断题选项必须依次为 True、False`);if(type==='true_false_not_given'&&q.options.map(v=>v.trim().toLowerCase()).join('|')!=='true|false|not given')throw Error(`第 ${i+1} 题三选判断题选项须为 True、False、Not Given`)}}function normalizeArticleText(value){
 return String(value||'').normalize('NFKC').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\s+/g,' ').trim().toLocaleLowerCase();
}
function doImport(raw){
 try{
  const data=JSON.parse(raw),list=Array.isArray(data)?data:[data];
  if(!list.length)throw Error('没有文章');
  list.forEach(validate);
  let added=0,duplicates=0,conflicts=[];
  // Do not overwrite a cloud-linked task or any existing learning history.
  const known=[...state.articles];
  for(const a of list){
   const title=normalizeArticleText(a.title),passage=normalizeArticleText(a.passage);
   const sameTitle=known.find(x=>normalizeArticleText(x.title)===title);
   const sameBody=known.find(x=>normalizeArticleText(x.passage)===passage);
   if((sameTitle&&normalizeArticleText(sameTitle.passage)===passage)||sameBody){
    duplicates++;
    
    continue;
   }
   if(sameTitle)conflicts.push('《'+a.title+'》与已有文章同名但正文不同，已作为独立文章导入。');
   const item={...a,id:'a'+Date.now()+Math.random().toString(36).slice(2,8),day:a.day||state.articles.length+1,studyDate:a.studyDate||dateKey(Date.now()),importedDate:new Date().toISOString()};
   state.articles.push(item);known.push(item);added++;
  }
  if(added)save();
  renderManage();
  $('importResult').textContent=`成功导入 ${added} 篇，跳过重复内容 ${duplicates} 篇。`+(conflicts.length?' '+conflicts.join(' '):'')+(duplicates?' 已有文章及其云端身份、成绩和解析均未修改。':'');
 }catch(e){$('importResult').textContent='导入失败：'+e.message}
}

async function zhTranslate(text){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);
 try{
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,430))+'&langpair=en|zh-CN',{signal:controller.signal});
  if(!r.ok)throw Error('translation HTTP '+r.status);
  const d=await r.json();const translated=(d.responseData?.translatedText||'').trim();
  if(!translated||/^(?:QUERY LENGTH LIMIT|MYMEMORY WARNING|INVALID LANGUAGE PAIR)/i.test(translated))throw Error('translation unavailable');
  return translated;
 }finally{clearTimeout(timeout)}
}

// Oxford 9 MDX: definitions live in <def><chn>, examples in <x>.
// Never show the raw, potentially enormous dictionary HTML in the popup.
function parseMdxEntry(html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const chinese=t=>(t||'').replace(/\s+/g,' ').trim();
 const meanings=[];
 for(const def of doc.querySelectorAll('def')){
  for(const el of def.querySelectorAll('chn')){
   const value=chinese(el.textContent);
   if(value && /[\u3400-\u9fff]/.test(value) && !meanings.includes(value))meanings.push(value);
  }
  if(meanings.length>=5)break;
 }
 // Some entries use a standalone <chn> rather than a <def>.
 if(!meanings.length)for(const el of doc.querySelectorAll('chn')){
  if(el.closest('x,example,ex,idiom,colloc'))continue;
  const value=chinese(el.textContent);
  if(value && value.length<85 && /[\u3400-\u9fff]/.test(value) && !meanings.includes(value))meanings.push(value);
  if(meanings.length>=4)break;
 }
 let example='',translation='';
 for(const el of doc.querySelectorAll('x')){
  const en=chinese(el.getAttribute('wd')||'');
  const zh=chinese(el.querySelector('chn')?.textContent||'');
  if(en && zh && en.length<260 && zh.length<260){example=en;translation=zh;break}
 }
 const summary=meanings.slice(0,4).join('；');
 return {summary,meanings:meanings.slice(0,4),example,translation};
}
async function tryOfflineWord(w){
 try{const mod=await mdxModule();const installed=await mod.status();if(!installed)return null;
 let found=await mod.query(w);
 if(!found){for(const variant of [w.replace(/ies$/,'y'),w.replace(/ing$/,''),w.replace(/ed$/,''),w.replace(/s$/,'')]){if(variant&&variant!==w){found=await mod.query(variant);if(found)break}}}
 if(!found)return null;
 if(found.html.startsWith('@@@LINK=')){const target=found.html.slice(8).replace(/\0/g,'').trim();if(target)found=await mod.query(target)||found}
 return {word:found.word,...parseMdxEntry(found.html)};
 }catch(err){console.warn('MDX lookup failed',err);return null}
}

/* V4.10.3 — controlled SW lifecycle: never reload a user mid-exercise. */
(function initSafeUpdates(){
 if(!('serviceWorker' in navigator))return;
 const banner=document.getElementById('rmUpdateNotice');
 const explanation=document.getElementById('rmUpdateExplanation');
 const apply=document.getElementById('rmUpdateApply');
 const later=document.getElementById('rmUpdateLater');
 let waiting=null, dismissed=false, approved=false, applying=false;
 const inExercise=()=>Boolean((articleId && !submitted && !reviewAttempt) || (window.rmPendingCloudSubmissions||0)>0);
 function show(){
  if(!waiting||dismissed)return;
  const busy=inExercise();
  explanation.textContent=busy?'检测到更新，当前答题不会被打断。提交并完成成绩同步后再更新，避免丢失答案。':'新版本已准备好。你可以选择现在更新，页面会重新加载。';
  apply.textContent=busy?'完成后更新':'现在更新';
  banner.hidden=false;
 }
 function accept(){
  if(!waiting)return;
  if(inExercise()){
   // Never reload even if the user taps update while answering.
   explanation.textContent='请先完成当前答题，并等待成绩上传完成后再更新。';
   apply.textContent='等待提交';
   return;
  }
  if(!confirm('现在重新加载 ReadMate 以使用新版本？请确认所有需要保存的内容已经提交。'))return;
  approved=true;applying=true;apply.disabled=true;
  explanation.textContent='正在切换新版本…';
  waiting.postMessage({type:'READMATE_ACTIVATE_UPDATE'});
  setTimeout(()=>{if(applying){apply.disabled=false;explanation.textContent='更新尚未完成，请稍后重试。';applying=false}},12000);
 }
 apply.addEventListener('click',accept);
 later.addEventListener('click',()=>{dismissed=true;banner.hidden=true});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(approved && !inExercise())window.location.reload();
  else if(approved){approved=false;applying=false;apply.disabled=false;show()}
 });
 navigator.serviceWorker.register('./sw.js').then(reg=>{
  function check(){if(reg.waiting && navigator.serviceWorker.controller){waiting=reg.waiting;show()}}
  check();
  reg.addEventListener('updatefound',()=>{
   const worker=reg.installing;if(!worker)return;
   worker.addEventListener('statechange',()=>{if(worker.state==='installed')check()});
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  // This only changes banner wording, not the user's answer or saved draft.
  document.addEventListener('click',e=>{
   if(e.target.closest('#submit,#retry,[data-open],[data-tab],[data-review],[data-redo]'))setTimeout(show,100);
  });
 }).catch(err=>console.warn('ReadMate 更新检查不可用',err));
})();
